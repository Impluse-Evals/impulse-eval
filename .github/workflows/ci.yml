# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not cancel the others.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Dry run of the examples (no model, no key)
        run: impulse run examples/config.yaml --dry-run

  docs:
    name: docs (links and Claude skill reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Markdown links
        run: >
          npx --yes markdown-link-check@3.15.0 --quiet
          --config .github/markdown-link-check.json
          README.md ROADMAP.md CONTRIBUTING.md SECURITY.md CONTRIBUTORS.md LICENSING.md docs/*.md

      - name: Claude skill reference is up to date
        run: python scripts/build_skill_reference.py && git diff --exit-code skills/
